name: Deploy MrcDelivery Sync to Windows Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el SDK de .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Compilar apuntando directamente al proyecto (.csproj)
      - name: Publish App
        run: dotnet publish ./MrcDeliverySync.csproj -c Release -o ./publish

      # 4. Transferir los archivos por SFTP con los nombres de parametros correctos
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          local_path: './publish/*'
          remote_path: ${{ secrets.SERVER_TARGET_DIR }}
          delete_remote: false
          exclude: 'appsettings.Production.json, web.config'