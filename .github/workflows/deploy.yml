name: Deploy MrcDelivery Sync to Windows Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el SDK de .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Compilar el proyecto .NET
      - name: Publish App
        run: dotnet publish ./MrcDeliverySync.csproj -c Release -o ./publish

      # 4. Eliminar los archivos sensibles del build antes de subir al servidor
      - name: Clean sensitive configs from build
        run: |
          rm -f ./publish/appsettings.Production.json
          rm -f ./publish/web.config

      # 5. Transferir los archivos por SFTP con los parámetros exactos requeridos
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          local_path: './publish/*'
          remote_path: ${{ secrets.SERVER_TARGET_DIR }}
          delete_remote_files: false
          sftp_only: true