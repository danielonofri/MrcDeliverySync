name: Deploy MrcDelivery Sync to Windows Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente desde el repositorio de GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el SDK de .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Versión de .NET 10

      # 3. Compilar y generar la publicación de la app Blazor
      - name: Publish App
        run: dotnet publish -c Release -o ./publish

      # 4. Transferir los archivos publicados a Windows Server vía SFTP
      - name: Deploy files via SFTP
        uses: SamKirsch/sftp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          localDir: './publish'
          remoteDir: ${{ secrets.SERVER_TARGET_DIR }}
          exclude: 'appsettings.Production.json'